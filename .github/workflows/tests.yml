name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_ot_moe -v
      - run: >-
          python -m py_compile better_moe_converter.py dot_moe_converter.py
          qwen_moe.py ot_moe.py professional_ask.py
